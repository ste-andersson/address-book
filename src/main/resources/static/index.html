<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address book</title>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Address book</h1>
    <form id="contactCreationForm">
        <div class="form-row">
        <label>First name</label>
        <input id="firstName">
        </div>
        <div class="form-row">
        <label>Last name</label>
        <input id="lastName">
        </div>
        <div class="form-row">
        <label>Country</label>
        <input id="country">
        </div>
        <div class="form-row">
        <label>City</label>
        <input id="city">
        </div>
        <div class="form-row">
        <label>Street name</label>
        <input id="streetName">
        </div>
        <div class="form-row">
        <label>Street number</label>
        <input id="streetNumber">
        </div>
        <button type="submit">Create</button>
    </form>

    <hr>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Street</th>
                <th>City</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="contactTableBody">
        </tbody>
</table>
</body>
</html>
